plugins {
    id 'com.android.application'
}

android {
    namespace 'com.starstackadam'
    compileSdk 35

    defaultConfig {
        applicationId 'com.starstackadam'
        minSdk 29
        targetSdk 35
        // versionName parte da 0.0.1. A ogni modifica aumenta l'ultimo numero
        // (0.0.2, 0.0.3, …) e versionCode di 1, così l'APK si aggiorna.
        versionCode 9
        versionName '0.0.9'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'commons-net:commons-net:3.11.1'
    implementation 'androidx.core:core:1.15.0'
}

// Pubblica l'APK su C:\WORK\ESA\Share dopo assembleDebug, senza "debug" nel nome.
def apkShareDir = file('C:/WORK/ESA/Share')

tasks.register('publishDebugApkToShare', Copy) {
    from(layout.buildDirectory.file('outputs/apk/debug/app-debug.apk'))
    into(apkShareDir)
    rename { 'StarStacKadam.apk' }
    doFirst {
        apkShareDir.mkdirs()
    }
    def publishedVersion = android.defaultConfig.versionName
    def publishedCode = android.defaultConfig.versionCode
    doLast {
        def previous = new File(apkShareDir, 'StarStacKadam-debug.apk')
        if (previous.exists()) previous.delete()
        def versionName = publishedVersion
        def versionCode = publishedCode
        def manifest = new File(apkShareDir, 'starstackadam-version.json')
        manifest.setText("""\
{
  "name": "StarStacKadam",
  "version": "${versionName}",
  "versionCode": ${versionCode},
  "apk": "StarStacKadam.apk",
  "source": "mega"
}
""", 'UTF-8')
    }
}

afterEvaluate {
    tasks.named('assembleDebug').configure {
        finalizedBy 'publishDebugApkToShare'
    }
}
