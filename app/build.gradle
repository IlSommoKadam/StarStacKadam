plugins {
    id 'com.android.application'
}

android {
    namespace 'com.stackadam'
    compileSdk 35

    defaultConfig {
        applicationId 'com.stackadam'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'commons-net:commons-net:3.11.1'
}
