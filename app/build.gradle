plugins {
    id 'com.android.application'
}

android {
    namespace 'com.starstackadam'
    compileSdk 35

    defaultConfig {
        applicationId 'com.starstackadam'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'commons-net:commons-net:3.11.1'
}

// Pubblica l'APK debug su C:\WORK\ESA\Share di default dopo assembleDebug
def apkShareDir = file('C:/WORK/ESA/Share')

tasks.register('publishDebugApkToShare', Copy) {
    from(layout.buildDirectory.file('outputs/apk/debug/app-debug.apk'))
    into(apkShareDir)
    rename { 'StarStacKadam-debug.apk' }
    doFirst {
        apkShareDir.mkdirs()
    }
}

afterEvaluate {
    tasks.named('assembleDebug').configure {
        finalizedBy 'publishDebugApkToShare'
    }
}
